<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 200" width="900" height="200" role="img"
     aria-label="Ramya Subramanian Porselva Bharathi — Sustainable Healthcare Robotics">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%"   stop-color="#062b45"/>
      <stop offset="48%"  stop-color="#0f6f8c"/>
      <stop offset="100%" stop-color="#1fa88f"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-80%" width="140%" height="260%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="2" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="3.4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="900" height="200" fill="url(#bg)"/>

  <!-- ================= text zone: y 0-128, kept clear of the graphic ============== -->
  <text x="450" y="52" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="30" font-weight="700" fill="#ffffff" letter-spacing="0.3">
    Ramya Subramanian Porselva Bharathi
  </text>

  <text x="450" y="80" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="13" font-weight="600" fill="#9ff0dc" letter-spacing="2.2">
    SUSTAINABLE HEALTHCARE ROBOTICS
  </text>

  <text x="450" y="101" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="11.5" fill="#cfeef2" fill-opacity="0.85" letter-spacing="0.8">
    Physical AI  ·  Medical Signal Processing  ·  M.S. Web and Data Science, Universität Koblenz
  </text>

  <text x="450" y="122" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="12" font-style="italic" fill="#eaffff" fill-opacity="0.72">
    Robots that carry care to the patients who are furthest from it
  </text>

  <!-- ================= graphic zone: y 140-200, no text crosses it ================ -->
  <!-- floor grid -->
  <g stroke="#ffffff" stroke-opacity="0.055" stroke-width="1">
    <path d="M0 158 H900 M0 176 H900 M0 194 H900"/>
    <path d="M150 142 V200 M300 142 V200 M450 142 V200 M600 142 V200 M750 142 V200"/>
  </g>

  <!--
    The idea of the whole portfolio, drawn once: a vital-sign waveform on the
    left resolves into a planned trajectory on the right, ending at a bedside
    where an alert is raised. Perception becoming action.
  -->
  <path d="M56 170 H150 l9 -3 7 5 8 -24 9 45 8 -23 7 3 h24 l8 -2 6 4 7 -15 8 27 7 -15 6 2 H400"
        fill="none" stroke="#eaffff" stroke-opacity="0.9" stroke-width="2.3"
        stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>

  <path d="M400 170 C 470 170, 500 162, 560 158 C 620 154, 660 152, 706 150"
        fill="none" stroke="#8ff3dd" stroke-opacity="0.8" stroke-width="2.2"
        stroke-linecap="round" stroke-dasharray="1 6.5"/>

  <!-- the rover, mid-drive -->
  <g transform="translate(706 150)">
    <rect x="-12" y="-7" width="24" height="12" rx="2.6" fill="#eaffff" fill-opacity="0.95"/>
    <rect x="-1.8" y="-13" width="3.6" height="7" rx="1.2" fill="#eaffff" fill-opacity="0.9"/>
    <circle cx="-6.5" cy="7" r="3" fill="#062b45" fill-opacity="0.9"/>
    <circle cx="6.5"  cy="7" r="3" fill="#062b45" fill-opacity="0.9"/>
    <path d="M15 -1 h11" stroke="#8ff3dd" stroke-width="2" stroke-linecap="round"/>
    <path d="M22 -5 l4.5 4 -4.5 4" fill="none" stroke="#8ff3dd" stroke-width="2"
          stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- the bedside it is driving to, with the alert raised above it -->
  <g transform="translate(772 143)">
    <rect x="0" y="0" width="46" height="12" rx="2.4" fill="#ffffff" fill-opacity="0.15"
          stroke="#eaffff" stroke-opacity="0.55" stroke-width="1.1"/>
    <rect x="0" y="-6" width="7" height="6" rx="1.4" fill="#eaffff" fill-opacity="0.45"/>
    <circle cx="23" cy="-15" r="4" fill="#ff6b6b" filter="url(#soft)"/>
  </g>

  <text x="56" y="192" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="9.5" fill="#eaffff" fill-opacity="0.42" letter-spacing="1.1">
    SIGNAL
  </text>
  <text x="450" y="192" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="9.5" fill="#eaffff" fill-opacity="0.42" letter-spacing="1.1">
    DECISION
  </text>
  <text x="844" y="192" text-anchor="end" font-family="Helvetica Neue, Helvetica, Arial, sans-serif"
        font-size="9.5" fill="#eaffff" fill-opacity="0.42" letter-spacing="1.1">
    ACTION
  </text>
</svg>
